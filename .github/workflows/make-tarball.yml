name: "Build XIVLauncher.Eto tarball"

on:
  workflow_dispatch:
  push:
    tags:
      - "eto-*"

jobs:
  MakeTarball:
    if: github.repository == 'rankynbass/XIVLauncher.Core'
    runs-on: ubuntu-22.04
    env:
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x # Set this to be the same as the projects required dotnet version.

      - name: Dotnet Build
        working-directory: src/XIVLauncher.Core/
        run: |
          dotnet restore
          dotnet publish -r linux-x64 --sc --configuration Release --no-restore -o ./dist/XIVLauncher.Core -p:BuildHash=$(git rev-parse --short HEAD)

      - name: Make tarball
        run: |
          cp README.md LICENSE src/XIVLauncher.Core/dist/XIVLauncher.Core/
          tar -czf XIVLauncher.Eto.tar.gz -C src/XIVLauncher.Core/dist/XIVLauncher.Core .
          sha512sum XIVLauncher.Eto.tar.gz > XIVLauncher.Eto.sha512sum

      - name: Archive the artifacts
        uses: actions/upload-artifact@v4
        with:
          name: XIVLauncher.Eto
          path: |
            XIVLauncher.Eto.tar.gz
            XIVLauncher.Eto.sha512sum
          compression-level: 0

  MakeZip:
    if: github.repository == 'rankynbass/XIVLauncher.Core'
    runs-on: windows-latest
    env:
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Dotnet Build
        run: |
          cd src/XIVLauncher.Core
          dotnet restore
          dotnet publish -r win-x64 --sc --configuration Release -o ./dist/XIVLauncher.Core-win -p:BuildHash=$(git rev-parse --short HEAD)

      - name: Archive the artifacts
        uses: actions/upload-artifact@v4
        with:
          name: XIVLauncher.Eto-win
          path: src/XIVLauncher.Core/dist/XIVLauncher.Core-win
        


      

      
