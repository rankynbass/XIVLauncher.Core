name: "Build XIVLauncher.Eto tarball"

on:
  workflow_dispatch:
  push:
    tags:
      - "eto-*"

jobs:
  MakeTarball:
    if: github.repository == 'rankynbass/XIVLauncher.Core'
    runs-on: ubuntu-latest
    env:
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x # Set this to be the same as the projects required dotnet version.

      - name: Dotnet Restore
        working-directory: src/XIVLauncher.Core/
        run: dotnet restore

      - name: Dotnet Build (Linux)
        working-directory: src/XIVLauncher.Core/
        run: dotnet publish -r linux-x64 --sc --configuration Release --no-restore -o ./dist/XIVLauncher.Core -p:BuildHash=$(git rev-parse --short HEAD)

      - name: Dotnet Build (Windows)
        working-directory: src/XIVLauncher.Core/
        run: dotnet publish -r win-x64 --sc --configuration Release -o ./dist/XIVLauncher.Core-win -p:BuildHash=$(git rev-parse --short HEAD)

      - name: Compress files
        run: |
          cp README.md LICENSE src/XIVLauncher.Core/dist/XIVLauncher.Core/
          cp README.md LICENSE src/XIVLauncher.Core/dist/XIVLauncer.Core-win/
          tar -czf XIVLauncher.Eto.tar.gz -C src/XIVLauncher.Core/dist/XIVLauncher.Core .
          zip -r XIVLauncher.Eto-win.zip src/XIVLauncher.Core/dist/XIVLauncher.Core-win
          sha512sum XIVLauncher.Eto.tar.gz > XIVLauncher.Eto.sha512sum
          sha512sum XIVLauncher.Eto-win.zip > XIVLauncher.Eto-win.sha512sum

      - name: Archive the artifacts
        uses: actions/upload-artifact@v4
        with:
          name: XIVLauncher.Eto
          path: |
            XIVLauncher.Eto.tar.gz
            XIVLauncher.Eto.sha512sum
            XIVLauncher.Eto-win.zip
            XIVLauncher.Eto-win.sha512sum
          compression-level: 0